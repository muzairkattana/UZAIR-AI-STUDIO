<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intern Task Assignment – UZAIR AI STUDIO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cabin:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#e9eef7;--panel:#fff;--tx:#1f2a3d;--mut:#5d6a80;--line:#d5deec;--bar:#0a2358;--ac:#0a5aa8;--field:#f5f8fd;--navy:#0a2358;--gold:#c9a24a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--panel:#121b2e;--tx:#e6ecf7;--mut:#9aa8c2;--line:#25324d;--bar:#06122e;--ac:#7ab6ff;--field:#0e1627}}
:root[data-theme="dark"]{--bg:#0b1220;--panel:#121b2e;--tx:#e6ecf7;--mut:#9aa8c2;--line:#25324d;--bar:#06122e;--ac:#7ab6ff;--field:#0e1627}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Cabin','Segoe UI',Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:20}
.app{display:flex;align-items:flex-start;min-height:100dvh}
.main{flex:1;min-width:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bar);color:#fff}
.bar img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px #c9a24a}
.bar b{font:800 15px 'Cinzel',Georgia,serif;letter-spacing:.1em}
.bar .lock{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
.bar .off{font:600 12px 'Cabin',sans-serif;color:#fff;background:transparent;border:1px solid #c9a24a;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.bar .off.ok{background:#c9a24a;color:#0a2358}
.ban{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;background:var(--bar);color:#fff;padding:10px 18px;border-radius:14px;border:1px solid #c9a24a;font-size:13px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:25;display:none}
.ban.on{display:block}
@media (max-width:520px){.bar b{display:none}}
#view{padding:22px 10px 40px;display:flex;justify-content:center}
#doc{width:794px;flex:none;-webkit-user-select:none;user-select:none}
.sheet{position:relative;width:794px;height:1123px;margin:0 auto 22px;background:#fff;color:#26303f;box-shadow:0 12px 40px rgba(6,18,46,.28);overflow:hidden}
.sheet .tb{position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#071a42,#0a5aa8,#c9a24a)}
.sheet .fr{position:absolute;inset:16px;border:1px solid #dcc989;pointer-events:none}
.sheet .wm{position:absolute;inset:0;pointer-events:none;opacity:.07}
.hd{position:absolute;left:54px;right:54px;top:30px;height:54px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #c9a24a}
.hd img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #c9a24a;-webkit-user-drag:none}
.hd b{font:800 17px 'Cinzel',Georgia,serif;letter-spacing:.12em;color:#0a2358;line-height:1.1}
.hd small{display:block;font:600 9.5px 'Cabin',sans-serif;letter-spacing:.18em;color:#0a5aa8;text-transform:uppercase}
.hd .rf{margin-left:auto;text-align:right;font-size:11px;color:#5d6a80;line-height:1.35}
.hd .rf b{font:700 11.5px 'Cabin',sans-serif;letter-spacing:.04em;color:#0a2358}
.pb{position:absolute;left:54px;right:54px;top:100px;height:950px;overflow:hidden}
.ft{position:absolute;left:54px;right:54px;bottom:28px;height:30px;border-top:1px solid #dcc989;display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:#5d6a80}
.ft b{color:#0a2358}
.u{margin:0 0 9px}.pb>.u:first-child{margin-top:0!important}
.ttl{margin-bottom:18px}
.ttl .k{font:700 11px 'Cabin',sans-serif;letter-spacing:.3em;color:#b08a2e;text-transform:uppercase}
.ttl h1{font:800 29px 'Cinzel',Georgia,serif;letter-spacing:.04em;color:#0a2358;margin:4px 0 6px;line-height:1.15}
.ttl p{font-size:13.5px;color:#4a5568;line-height:1.55;margin-bottom:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #d5deec;border-left:4px solid #c9a24a;border-radius:6px;background:linear-gradient(180deg,#f7faff,#eef3fb)}
.sum div{padding:9px 12px;border-right:1px solid #e1e8f3;border-bottom:1px solid #e1e8f3}
.sum div:nth-child(3n){border-right:0}.sum div:nth-child(n+4){border-bottom:0}
.sum small{display:block;font:600 9.5px 'Cabin',sans-serif;letter-spacing:.14em;color:#6a7690;text-transform:uppercase}
.sum span{font:700 14px 'Cabin',sans-serif;color:#0a2358}
.th{margin-top:18px;display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f1f5fc;border-left:4px solid #c9a24a;border-radius:0 8px 8px 0}
.th .no{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0a2358,#0a5aa8);color:#f1d98a;font:800 14px 'Cinzel',serif;display:flex;align-items:center;justify-content:center}
.th h3{flex:1;font:700 16.5px 'Cabin',sans-serif;color:#0a2358;line-height:1.25}
.chip{flex:none;font:700 10.5px 'Cabin',sans-serif;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.c-High{color:#a8321f;border-color:#e2a99e;background:#fff3f0}.c-Medium{color:#8a6410;border-color:#e3cc8c;background:#fff9e8}.c-Low{color:#2c7a4b;border-color:#a9d4b9;background:#f0faf4}.c-due{color:#0a4a96;border-color:#b6cbea;background:#eef4fd}
.r{border-left:3px solid #e8dbae;padding-left:15px;margin:0;padding-bottom:9px}.th+.r{margin-top:0}
.lb{font:700 11px 'Cabin',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#0a5aa8;margin-top:6px}
.p{font-size:14px;line-height:1.66;color:#33405a}
.li{display:flex;gap:10px;font-size:14px;line-height:1.6;color:#33405a}
.li i{flex:none;width:7px;height:7px;margin-top:8px;background:#c9a24a;transform:rotate(45deg)}
.li.cont i{visibility:hidden}
.sg{margin-top:14px;padding:12px 14px;border:1px dashed #c9a24a;border-radius:8px;background:#fffdf6;font-size:13px;color:#4a5568}
.sg b{color:#0a2358}
.code-wrap{margin:8px 0 10px;border-radius:8px;background:#0d1117;border:1px solid #30363d;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.18)}
.code-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#161b22;border-bottom:1px solid #21262d;font:600 11px monospace;color:#8b949e}
.code-dots{display:flex;gap:5px;align-items:center}
.code-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.cd-r{background:#ff5f56}.cd-y{background:#ffbd2e}.cd-g{background:#27c93f}
.code-pre{margin:0;padding:12px 14px;font-family:'JetBrains Mono','Courier New',monospace;font-size:12px;line-height:1.55;color:#79c0ff;background:#0d1117;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.shield{display:none}
@media print{@page{size:A4 portrait;margin:0}.bar,.ban,#off{display:none!important}html,body{background:#fff!important;display:block!important;padding:0!important}#view{padding:0!important;margin:0!important}#doc{zoom:1!important;transform:none!important;width:100%!important}.sheet{box-shadow:none!important;margin:0 auto!important;page-break-after:always;page-break-inside:avoid}}
.np .app{visibility:hidden}
</style>
</head>

const fmt=v=>{if(!v)return"";const d=new Date(v+"T00:00");return isNaN(d)?v:d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
const el=(c,h)=>{const d=document.createElement("div");d.className=c;if(h!=null)d.innerHTML=h;return d};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=t=>(t||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);

/* ---------- build units ---------- */
function unit(type,text,cont){
  if(type==="p"){const e=el("u r p"+(cont?" cont":""));e.textContent=text;return{el:e,tgt:e,text,type,split:1}}
  if(type==="li"){const e=el("u r li"+(cont?" cont":""),"<i></i><span></span>");const s=e.querySelector("span");s.textContent=text;return{el:e,tgt:s,text,type,split:1}}
  if(type==="code"){
    const e=el("u r code-wrap",'<div class="code-bar"><div class="code-dots"><span class="code-dot cd-r"></span><span class="code-dot cd-y"></span><span class="code-dot cd-g"></span><span style="margin-left:6px;font-weight:700;color:#c9d1d9;">Architecture Code Blueprint</span></div><span style="color:#58a6ff;font-size:10px;">PROD SPEC</span></div><pre class="code-pre"></pre>');
    const p=e.querySelector("pre");
    p.textContent=text;
    return{el:e,tgt:p,text,type,split:0};
  }
}
function units(){
  const m=S.meta,U=[],add=(e,k)=>{if(k)e.dataset.kwn=1;U.push({el:e})};
  const title=el("u ttl",'<div class="k">Assignment of tasks</div><h1>Internship Task Assignment</h1><p>Dear <b>'+esc(m.intern||"Intern")+'</b>, welcome aboard. Below is your assigned work plan. Please read every task carefully, follow the deliverables, and submit before each due date.</p><div class="sum"><div><small>Intern</small><span>'+esc(m.intern)+'</span></div><div><small>Track</small><span>'+esc(m.track)+'</span></div><div><small>Mentor</small><span>'+esc(m.mentor)+'</span></div><div><small>Period</small><span>'+esc(m.period)+'</span></div><div><small>Issued</small><span>'+esc(fmt(m.issued))+'</span></div><div><small>Total tasks</small><span>'+S.tasks.length+'</span></div></div>');
  U.push({el:title});
  S.tasks.forEach((t,i)=>{
    add(el("u th",'<span class="no">'+String(i+1).padStart(2,"0")+'</span><h3>'+esc(t.title||"Untitled task")+'</h3><span class="chip c-'+esc(t.priority)+'">'+esc((t.priority||"").toUpperCase())+'</span>'+(t.due?'<span class="chip c-due">DUE '+esc(fmt(t.due).toUpperCase())+'</span>':"")),1);
    if(lines(t.desc).length){add(el("u r lb","Description"),1);lines(t.desc).forEach(x=>U.push(unit("p",x)))}
    if(lines(t.deliv).length){add(el("u r lb","Deliverables"),1);lines(t.deliv).forEach(x=>U.push(unit("li",x)))}
    if(t.codeTemplate && t.codeTemplate.trim().length){add(el("u r lb","Starter Code / Architectural Pattern"),1);U.push(unit("code",t.codeTemplate.trim()))}
    if(lines(t.notes).length){add(el("u r lb","Mentor notes"),1);lines(t.notes).forEach(x=>U.push(unit("p",x)))}
  });
  add(el("u th","<h3>Submission Guidelines</h3>"),1);
  ["Submit completed work to your mentor at "+MAIL+" before each due date.","Keep your work original, and use clear file names and commit messages.","If you are blocked, ask early. Asking for help is part of learning."].forEach(x=>U.push(unit("li",x)));
  U.push({el:el("u sg","Assigned by <b>Muhammad Uzair</b> · Owner &amp; Founder, UZAIR AI STUDIO")});
  return U;
}

/* ---------- pagination ---------- */
function wmURL(){const t=((S.meta.intern||"")+" · UZAIR AI STUDIO").toUpperCase();
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='330' height='210'><text x='165' y='105' transform='rotate(-28 165 105)' text-anchor='middle' font-family='Arial' font-weight='700' font-size='15' letter-spacing='3' fill='#0a2358'>"+esc(t)+"</text></svg>";
  return"url(\"data:image/svg+xml,"+encodeURIComponent(svg).replace(/%26amp%3B/g,"%26amp%3B")+"\")"}
function newSheet(){
  const m=S.meta,s=el("sheet",'<div class="tb"></div><div class="fr"></div><div class="wm"></div><div class="hd"><img alt="" draggable="false" src="'+LOGO+'"><div><b>UZAIR AI STUDIO</b><small>Task Assignment</small></div><div class="rf">Reference<br><b>'+esc(m.ref)+'</b></div></div><div class="pb"></div><div class="ft"><span>Empowering Futures Through Technology</span><span>Confidential · for the named intern only</span><b class="pg"></b></div>');
  s.querySelector(".wm").style.backgroundImage=wmURL();doc.appendChild(s);return s.querySelector(".pb")}
const over=b=>b.scrollHeight>b.clientHeight+1;
function paginate(){
  doc.style.zoom=1;doc.innerHTML="";let pb=newSheet();const q=units();
  while(q.length){
    const u=q.shift();pb.appendChild(u.el);
    if(!over(pb))continue;
    if(u.split){
      const w=u.text.split(" ");let lo=0,hi=w.length-1;
      while(lo<hi){const mid=Math.ceil((lo+hi)/2);u.tgt.textContent=w.slice(0,mid).join(" ");if(over(pb))hi=mid-1;else lo=mid}
      if(lo>0){u.tgt.textContent=w.slice(0,lo).join(" ");q.unshift(unit(u.type,w.slice(lo).join(" "),1));pb=newSheet();continue}
      u.tgt.textContent=u.text}
    pb.removeChild(u.el);const carry=[];
    while(pb.lastElementChild&&pb.lastElementChild.dataset.kwn&&pb.children.length>1){carry.unshift(pb.lastElementChild);pb.removeChild(pb.lastElementChild)}
    pb=newSheet();carry.forEach(c=>pb.appendChild(c));pb.appendChild(u.el)}
  const n=doc.children.length;[...doc.querySelectorAll(".pg")].forEach((p,i)=>p.textContent="Page "+(i+1)+" of "+n);
  scale()}
function scale(){const w=$('view').clientWidth-20;doc.style.zoom=Math.min(1,w/794)}

/* ---------- view-only protection ---------- */
document.addEventListener("contextmenu",e=>{e.preventDefault()});
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["p","s","u"].includes(e.key.toLowerCase()))e.preventDefault()});
// In-portal printing supported

paginate();addEventListener("resize",scale);
const off=$('off'),ban=$('ban');let bt;
const say=m=>{ban.textContent=m;ban.classList.add("on");clearTimeout(bt);bt=setTimeout(()=>ban.classList.remove("on"),4500)};
const taskKey = () => (S && S.meta && S.meta.ref) ? (OFFK + "_" + S.meta.ref) : OFFK;
const has=()=>{try{return!!(localStorage.getItem(taskKey()) || localStorage.getItem(OFFK))}catch(e){return false}};
const mark=()=>{const ok=has();off.classList.toggle("ok",ok);off.textContent=ok?"Offline ready ✓":"Save for offline"};
off.onclick=()=>{try{const k=taskKey();localStorage.setItem(k,JSON.stringify({t:Date.now(),S}));localStorage.setItem(OFFK,JSON.stringify({t:Date.now(),S}));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();mark();say("Saved inside this portal for offline reading. It can’t be downloaded or printed.")}catch(e){say("Offline saving isn’t available in this browser.")}};
addEventListener("offline",()=>say(has()?"You’re offline. Your saved copy stays available while this page is open.":"You’re offline. Open the page online and tap “Save for offline”."));
addEventListener("online",()=>say("Back online."));
mark();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paginate);
</script>
</body>
</html>
